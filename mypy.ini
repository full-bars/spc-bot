[mypy]
python_version = 3.12
ignore_missing_imports = true
follow_imports = silent
# cogs are added to the gate incrementally as annotations mature.

[mypy-cogs.*]
# bot.state (and similar runtime-attached attributes) are assigned in main.py
# (bot.state = BotState()); mypy cannot see them through discord.py's Bot type.
# Everything else in these modules is still type-checked.
disable_error_code = attr-defined
