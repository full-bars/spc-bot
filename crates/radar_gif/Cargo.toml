[package]
name = "radar_gif"
version = "0.1.0"
edition = "2021"

[dependencies]
radar_core = { git = "https://github.com/FahrenheitResearch/bowecho" }
color_tables = { git = "https://github.com/FahrenheitResearch/bowecho" }
nexrad_io = { git = "https://github.com/FahrenheitResearch/bowecho" }
data_source = { git = "https://github.com/FahrenheitResearch/bowecho" }
render2d = { git = "https://github.com/FahrenheitResearch/bowecho" }
product_engine = { git = "https://github.com/FahrenheitResearch/bowecho" }
image = "0.25"
imageproc = "0.27"
ab_glyph = "0.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
gif = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.39", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
