[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Capture logs but don't stream them to stdout by default — CI output was
# drowning in INFO-level logs from the bot under test. Pass
# `-o log_cli=true -o log_cli_level=DEBUG` on the command line when
# debugging a specific test.
log_cli = false
log_level = WARNING
markers =
    real_create_task: opt out of global asyncio.create_task suppression (for tests that exercise internal task-based concurrency like fetch_md_details)
addopts = --ignore-glob=*sync-conflict*
filterwarnings =
    ignore::DeprecationWarning:discord.*
    ignore::DeprecationWarning:aiohttp.*
    ignore:coroutine.*was never awaited:RuntimeWarning
    # Suppress "coroutine was never awaited" warnings from mock internals.
    # These occur when async methods are patched but the mock framework itself
    # generates spurious coroutine objects. All tests pass; these are artifacts
    # of how unittest.mock and AsyncMock handle async function wrapping.
