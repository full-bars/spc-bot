repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin to the same minor as requirements-dev.txt: ruff>=0.16.1,<0.17.0
    rev: v0.16.1
    hooks:
      - id: ruff
        # Rule set comes from ruff.toml (E4/E7/E9/F/B)
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (utils + first cogs)
        args: [--config-file, mypy.ini]
        files: ^(utils/|lib/vtec_parser\.py|cogs/status\.py|cogs/sounding\.py|cogs/sounding_utils\.py)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(deploy\.sh|install-hooks\.sh|\.githooks/)\.?[^/]*$

  # Rust hooks — require cargo, rustfmt, and clippy in PATH.
  # On most developer machines these arrive via `rustup component add rustfmt clippy`.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        language: system
        entry: cargo fmt --all -- --check
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --all-targets --all-features -- -D warnings
        types: [rust]
        pass_filenames: false
