version: 2
updates:
  # Python runtime + dev dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group all non-major bumps into one PR per week to keep noise low.
      # Major bumps stay individual so they get their own review.
      python-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
    ignore:
      # upload-artifact and download-artifact were bumped to v7/v8 previously
      # (PR #335) and had to be reverted twice (#396, #397) due to breakage
      # in the Docker multi-platform digest workflow. Stay on @v4 until the
      # root cause is diagnosed.
      - dependency-name: "actions/upload-artifact"
        versions: [">=5"]
      - dependency-name: "actions/download-artifact"
        versions: [">=5"]

  # Rust crate dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
