version: 2
updates:
  # Python runtime + dev dependencies
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Group all non-major bumps into one PR per week to keep noise low.
      # Major bumps stay individual so they get their own review.
      python-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
    ignore:
      # upload-artifact and download-artifact were bumped to v7/v8 previously
      # (PR #335) and had to be reverted twice (#396, #397) due to breakage
      # in the Docker multi-platform digest workflow. Stay on @v4 until the
      # root cause is diagnosed.
      - dependency-name: "actions/upload-artifact"
        versions: [">=5"]
      - dependency-name: "actions/download-artifact"
        versions: [">=5"]

  # Rust crate dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - rust
    ignore:
      # The XMPP crate stack is pinned to the 4.x line. The coordinated bump to
      # tokio-xmpp 5.0 / xmpp-parsers 0.22 / minidom 0.18 was attempted and
      # reverted (issue #464, PR #465). tokio-xmpp 5.0's strict xso parser
      # treats any un-parseable incoming stanza as a FATAL stream error, and a
      # non-compliant peer in the NWWS-OI MUC ("TropiTracker NWWS Ingest"
      # broadcasts "[object Object]" as text in its presence) triggers an
      # infinite reconnect loop with zero ingestion. tokio-xmpp 4 tolerates it.
      # Do not re-raise until upstream makes stanza parse errors non-fatal.
      - dependency-name: "tokio-xmpp"
        versions: [">=5"]
      - dependency-name: "xmpp-parsers"
        versions: [">=0.22"]
      - dependency-name: "minidom"
        versions: [">=0.17"]

  # Base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
