name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff
      - name: Ruff (syntax, undefined-name, unused imports)
        run: ruff check --select=E9,F63,F7,F82,F401 --exclude=venv,lib,cache .

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Rust extensions
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1
        run: |
          # 1. Ensure Rust is in PATH
          export PATH="$HOME/.cargo/bin:/root/.cargo/bin:$PATH"
          
          # 2. Install Rust if missing
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
            . "$HOME/.cargo/env" || . "/root/.cargo/env"
          fi
          
          # 3. Build and install extension
          pip install maturin
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -n auto \
            --cov=cogs --cov=utils --cov=config --cov=main \
            --cov-report=term-missing --cov-report=xml -v
      - name: Upload coverage artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install mypy
        run: pip install mypy
      - name: mypy (utils — lenient, ignore-missing-imports)
        # Scope limited to utils/ where types are cleanest. Expand scope
        # incrementally as annotations are added to other modules.
        run: mypy --ignore-missing-imports --follow-imports=silent utils/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # cargo test is deferred: the crate uses pyo3 with `extension-module`
      # unconditionally, so test binaries fail to link against libpython.
      # Re-enable once the crate is restructured to gate `extension-module`
      # behind an optional feature so `cargo test --no-default-features` works.

  docker-build:
    # Verify the image builds on main branch and tags. Skip on PRs to save CI time.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: spc-bot:ci
          cache-from: type=gha,scope=build-linux/amd64
          cache-to: type=gha,mode=max,scope=build-linux/amd64
      - name: Smoke test — image imports main.py
        env:
          DISCORD_TOKEN: ci-smoke-token
          SPC_CHANNEL_ID: '1'
          MODELS_CHANNEL_ID: '2'
          GUILD_ID: '3'
          FAILOVER_TOKEN: ci-smoke-failover-token
        run: |
          docker run --rm \
            -e DISCORD_TOKEN -e SPC_CHANNEL_ID -e MODELS_CHANNEL_ID \
            -e GUILD_ID -e FAILOVER_TOKEN \
            spc-bot:ci python -c "import main; print('import ok')"
