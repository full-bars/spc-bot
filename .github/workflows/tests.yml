name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.actor == 'dependabot[bot]' && 'dependabot-updates' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.actor != 'dependabot[bot]' }}

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (configured rule set via ruff.toml)
        run: ruff check --exclude=venv,lib,cache .
      - name: Ruff format check
        run: ruff format --check --exclude=venv,lib,cache .
      - name: Shellcheck (deploy.sh)
        run: shellcheck deploy.sh

  test:
    runs-on: ubuntu-latest
    needs: [lint, rust]
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build Rust extensions
        run: maturin build --release --out dist && pip install dist/*.whl
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -n auto \
            --cov=cogs --cov=utils --cov=config --cov=main \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=40 -v
      - name: Upload coverage artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: mypy (utils + lib/vtec_parser + first cogs — lenient, ignore-missing-imports)
        # lib/vtec_parser.py added in v5.25.2; expand to more cogs/ incrementally as annotations mature
        run: mypy --config-file mypy.ini utils/ lib/vtec_parser.py cogs/status.py cogs/sounding.py cogs/sounding_utils.py cogs/warnings.py cogs/watches.py cogs/outlooks.py cogs/mesoscale.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --no-default-features

  docker-build:
    # Verify the image builds on all pushes and PRs.
    # ARM64 uses a persistent local disk cache on the self-hosted runner so
    # Cartopy/arm-pyart wheel compilation is skipped on every run after the
    # first. amd64 uses the GHA layer cache (ephemeral runner has no local disk
    # to persist across jobs).
    needs: [test, mypy, rust]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-from: type=gha,scope=build-linux/amd64
            cache-to: type=gha,mode=max,scope=build-linux/amd64
          - platform: linux/arm64
            runner: [self-hosted, Linux, ARM64]
            cache-from: type=local,src=/mnt/storage/actions-runner/.buildx-cache/spc-bot
            cache-to: type=local,dest=/mnt/storage/actions-runner/.buildx-cache/spc-bot-new,mode=max
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: spc-bot:ci
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}
      - name: Rotate local build cache (ARM64 only)
        if: matrix.platform == 'linux/arm64'
        run: |
          rm -rf /mnt/storage/actions-runner/.buildx-cache/spc-bot
          mv /mnt/storage/actions-runner/.buildx-cache/spc-bot-new /mnt/storage/actions-runner/.buildx-cache/spc-bot
      - name: Smoke test — image imports main.py
        env:
          DISCORD_TOKEN: ci-smoke-token
          SPC_CHANNEL_ID: '1'
          MODELS_CHANNEL_ID: '2'
          GUILD_ID: '3'
          FAILOVER_TOKEN: ci-smoke-failover-token
        run: |
          docker run --rm \
            -e DISCORD_TOKEN -e SPC_CHANNEL_ID -e MODELS_CHANNEL_ID \
            -e GUILD_ID -e FAILOVER_TOKEN \
            spc-bot:ci python -c "import main; print('import ok')"
