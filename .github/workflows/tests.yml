name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (syntax, undefined-name, unused imports)
        run: ruff check --select=E9,F63,F7,F82,F401 --exclude=venv,lib,cache .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    container:
      image: ghcr.io/${{ github.repository }}/ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Build Rust extensions
        run: maturin build --release --out dist && pip install dist/*.whl
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -n auto \
            --cov=cogs --cov=utils --cov=config --cov=main \
            --cov-report=term-missing --cov-report=xml -v
      - name: Upload coverage artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: mypy (utils + lib/vtec_parser — lenient, ignore-missing-imports)
        # lib/vtec_parser.py added in v5.25.2; expand to cogs/ incrementally as annotations mature
        run: mypy --ignore-missing-imports --follow-imports=silent utils/ lib/vtec_parser.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (stable + fmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # cargo test is deferred: the crate uses pyo3 with `extension-module`
      # unconditionally, so test binaries fail to link against libpython.
      # Re-enable once the crate is restructured to gate `extension-module`
      # behind an optional feature so `cargo test --no-default-features` works.

  docker-build:
    # Verify the image builds on all pushes and PRs.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: spc-bot:ci
          cache-from: type=gha,scope=build-linux/amd64
          cache-to: type=gha,mode=max,scope=build-linux/amd64
      - name: Smoke test — image imports main.py
        env:
          DISCORD_TOKEN: ci-smoke-token
          SPC_CHANNEL_ID: '1'
          MODELS_CHANNEL_ID: '2'
          GUILD_ID: '3'
          FAILOVER_TOKEN: ci-smoke-failover-token
        run: |
          docker run --rm \
            -e DISCORD_TOKEN -e SPC_CHANNEL_ID -e MODELS_CHANNEL_ID \
            -e GUILD_ID -e FAILOVER_TOKEN \
            spc-bot:ci python -c "import main; print('import ok')"
