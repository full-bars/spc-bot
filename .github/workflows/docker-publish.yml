name: Docker Build and Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-from: type=gha,scope=build-linux/amd64
            cache-to: type=gha,mode=max,scope=build-linux/amd64
          - platform: linux/arm64
            runner: [self-hosted, Linux, ARM64]
            cache-from: type=local,src=/mnt/storage/actions-runner/.buildx-cache/spc-bot
            cache-to: type=local,dest=/mnt/storage/actions-runner/.buildx-cache/spc-bot-new,mode=max
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: ${{ matrix.cache-from }}
          cache-to: ${{ matrix.cache-to }}

      - name: Rotate local build cache (ARM64 only)
        if: matrix.platform == 'linux/arm64'
        run: |
          rm -rf /mnt/storage/actions-runner/.buildx-cache/spc-bot
          mv /mnt/storage/actions-runner/.buildx-cache/spc-bot-new /mnt/storage/actions-runner/.buildx-cache/spc-bot

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      - name: Checkout for Export
        uses: actions/checkout@v7

      - name: Export Tarballs
        run: |
          for plat in amd64 arm64; do
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }} --platform linux/$plat
            docker save ghcr.io/${{ github.repository }}:${{ github.ref_name }} | gzip > spcbot-${{ github.ref_name }}-linux-$plat.tar.gz
          done

      - name: Install ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          # Update signatures. Use a generous timeout: freshclam can be slow on
          # first run (downloads the full CVD database).
          sudo freshclam --quiet || true
          clamscan --version

      - name: ClamAV self-test (EICAR)
        run: |
          echo -n 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.com
          set +e
          clamscan --no-summary /tmp/eicar.com
          RC=$?
          set -e
          if [ "$RC" -ne 1 ]; then
            echo "EICAR self-test failed: expected exit 1 (virus found), got $RC"
            exit 1
          fi
          echo "ClamAV self-test OK: EICAR detected"

      - name: ClamAV scan of docker tarballs
        run: |
          FAILED=0
          for f in spcbot-*.tar.gz; do
            echo "=== clamscan $f (this can take a few minutes on ~500MB) ==="
            set +e
            clamscan --infected --no-summary "$f"
            RC=$?
            set -e
            if [ "$RC" -eq 1 ]; then
              echo "INFECTED: $f"
              FAILED=1
            elif [ "$RC" -gt 1 ]; then
              echo "CLAMSCAN ERROR ($RC): $f"
              FAILED=1
            else
              echo "CLEAN: $f"
            fi
          done
          exit "$FAILED"

      - name: VirusTotal scan of source archive (tags only)
        if: ${{ secrets.VIRUS_TOTAL != '' }}
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL }}
          VT_FAIL_THRESHOLD: "10"
          VT_REVIEW_THRESHOLD: "2"
          VT_SUMMARY_FILE: ${{ github.workspace }}/vt-scan-report.md
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git archive --format=zip --prefix=spc-bot/ -o /tmp/spc-bot-src-${{ github.ref_name }}.zip HEAD
          python3 .github/scripts/vt-scan.py /tmp/spc-bot-src-${{ github.ref_name }}.zip

      - name: Append scan report to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="${{ github.workspace }}/vt-scan-report.md"
          if [ ! -f "$REPORT" ]; then
            echo "No scan report found; release notes unchanged"
            exit 0
          fi
          # Append ClamAV result line to the VT report (ClamAV has no
          # permalink; its pass/fail is represented by the step result).
          {
            echo ""
            echo "## ClamAV Scan"
            echo ""
            echo "The docker image tarballs were scanned with ClamAV (Cisco Talos signatures) during CI."
            echo ""
          } >> "$REPORT"
          BODY_FILE=$(mktemp)
          # The release page may not exist yet if this workflow beats the
          # release-creation step. Non-fatal: the Upload Release Assets step
          # below is the authoritative gate for a missing release.
          if ! gh release view "${{ github.ref_name }}" --json body --jq .body > "$BODY_FILE" 2>/dev/null; then
            echo "Release page not found yet; skipping notes append"
            exit 0
          fi
          echo "" >> "$BODY_FILE"
          cat "$REPORT" >> "$BODY_FILE"
          gh release edit "${{ github.ref_name }}" --notes-file "$BODY_FILE"
          echo "Appended scan report to release notes"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} spcbot-${{ github.ref_name }}-linux-amd64.tar.gz spcbot-${{ github.ref_name }}-linux-arm64.tar.gz --clobber
