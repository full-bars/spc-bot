# logrotate configuration for spc-bot
# Install to /etc/logrotate.d/spc-bot with: sudo cp config/logrotate.conf /etc/logrotate.d/spc-bot
#
# Or run manually with: logrotate -f /etc/logrotate.d/spc-bot
# Test without applying: logrotate -d /etc/logrotate.d/spc-bot

/home/ubuntu/spc-bot/spc_bot.log {
    daily
    missingok
    rotate 30
    compress
    delaycompress
    notifempty
    create 0644 ubuntu ubuntu
    sharedscripts
    postrotate
        # Optional: send signal to bot on rotation (if using PID file)
        # if [ -f /var/run/spc-bot.pid ]; then
        #     kill -HUP $(cat /var/run/spc-bot.pid) 2>/dev/null || true
        # fi
    endscript
}
